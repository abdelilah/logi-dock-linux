# Logi Dock (046d:0acc): the dock's UAC volume control runs 1..100 in
# "percent" units but its descriptor labels them as 1/256 dB (0-0.39 dB total).
# Ignore the bogus dB data so PipeWire drives the dock's hardware volume
# linearly instead of attenuating the 16-bit stream in software.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-Logi_Logi_Dock*" } ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
      }
    }
  }
]
